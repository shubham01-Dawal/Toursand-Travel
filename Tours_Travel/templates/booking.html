<!-- BOOKING -->

<section class="auth-page">

    <div class="container">

        <div class="booking-card">

            <h2 class="mb-4">

                Book Your Tour

            </h2>


            <div class="booking-summary">

                <p class="mb-1 text-muted">

                    Selected Tour

                </p>

                <h3 id="bookingTourName">

                    Tour Package

                </h3>

                <div
                    class="booking-price"
                    id="bookingTourPrice">

                    ₹0

                </div>

            </div>


            <form id="bookingForm">


                <div class="row g-3">


                    <div class="col-md-6">

                        <label class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">

                            Phone Number

                        </label>

                        <input
                            type="tel"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">

                            Travel Date

                        </label>

                        <input
                            type="date"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">

                            Number of Persons

                        </label>

                        <input
                            type="number"
                            min="1"
                            value="1"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-12">

                        <label class="form-label">

                            Payment Method

                        </label>

                        <select
                            class="form-select"
                            required>

                            <option value="">

                                Select Payment Method

                            </option>

                            <option>

                                UPI

                            </option>

                            <option>

                                Credit / Debit Card

                            </option>

                            <option>

                                Net Banking

                            </option>

                            <option>

                                Cash

                            </option>

                        </select>

                    </div>


                    <div class="col-12 mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Confirm Booking

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</section>


<script
