<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register | TravelGo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../static/css/style.css">

</head>

<body>


<section class="auth-page">

    <div class="container">

        <div class="auth-card">

            <div class="auth-logo mb-2">

                Travel<span>Go</span>

            </div>

            <p class="text-center text-muted mb-4">

                Create your TravelGo account.

            </p>


            <form id="registerForm">


                <div class="mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                        type="text"
                        id="registerName"
                        class="form-control"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Email Address

                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Phone Number

                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        class="form-control"
                        placeholder="Enter phone number"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">

                        Password

                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        placeholder="Create password"
                        required>

                </div>


                <div class="mb-4">

                    <label class="form-label">

                        Confirm Password

                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm password"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Create Account

                </button>

            </form>


            <p class="text-center mt-4 text-muted">

                Already have an account?

                <a
                    href="login.html"
                    class="text-primary fw-semibold">

                    Login

                </a>

            </p>


            <div class="text-center">

                <a
                    href="../index.html"
                    class="text-muted">

                    ← Back to Home

                </a>

            </div>

        </div>

    </div>

</section>


<script src="../static/js/main.js"></script>

</body>

</html>
