<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | TravelGo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Admin CSS -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-body">

    <div class="admin-login-card">
        <div class="admin-login-brand">
            Travel<span>Go</span>
        </div>
        <p class="text-center text-muted mb-4 small fw-semibold">ADMIN MANAGEMENT PORTAL</p>

        <!-- Demo Credentials Helper -->
        <div class="alert alert-info border-0 bg-info-subtle text-info-emphasis p-3 rounded-3 mb-4">
            <div class="d-flex align-items-center gap-2 fw-bold mb-1">
                <i class="bi bi-info-circle-fill"></i> Demo Administrator Credentials:
            </div>
            <div class="small"><strong>Email:</strong> admin@travelgo.com</div>
            <div class="small"><strong>Password:</strong> Admin@123</div>
        </div>

        <div id="login-error-alert" class="alert alert-danger d-none" role="alert"></div>

        <form id="admin-login-form">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="login-email" class="form-control" placeholder="admin@travelgo.com" required value="admin@travelgo.com">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="Admin@123">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-password-btn">
                        <i class="bi bi-eye" id="toggle-password-icon"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 small">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember-me" checked>
                    <label class="form-check-label text-muted" for="remember-me">Remember me</label>
                </div>
                <a href="#" class="text-decoration-none text-primary" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold shadow-sm" style="background-color: #0f766e; border-color: #0f766e;">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="../templates/login.html" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to User Login</a>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-key me-2 text-warning"></i>Reset Admin Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="text-muted small">Enter your admin email address below to receive password reset instructions.</p>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Admin Email</label>
                        <input type="email" id="reset-email" class="form-control" placeholder="admin@travelgo.com">
                    </div>
                    <button type="button" class="btn btn-primary w-100" id="btn-send-reset" style="background-color: #0f766e; border-color: #0f766e;">Send Reset Link</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin-data.js"></script>
    <script src="js/admin-auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const togglePasswordBtn = document.getElementById("toggle-password-btn");
            const passwordInput = document.getElementById("login-password");
            const passwordIcon = document.getElementById("toggle-password-icon");

            togglePasswordBtn.addEventListener("click", function () {
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    passwordIcon.className = "bi bi-eye-slash";
                } else {
                    passwordInput.type = "password";
                    passwordIcon.className = "bi bi-eye";
                }
            });

            const loginForm = document.getElementById("admin-login-form");
            const errorAlert = document.getElementById("login-error-alert");

            loginForm.addEventListener("submit", function (e) {
                e.preventDefault();
                errorAlert.classList.add("d-none");

                const email = document.getElementById("login-email").value.trim();
                const password = passwordInput.value.trim();
                const remember = document.getElementById("remember-me").checked;

                const result = AdminAuth.login(email, password, remember);
                if (result.success) {
                    AdminData.showToast("Login successful! Redirecting...", "success");
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 500);
                } else {
                    errorAlert.textContent = result.message;
                    errorAlert.classList.remove("d-none");
                }
            });

            document.getElementById("btn-send-reset").addEventListener("click", function () {
                const resetEmail = document.getElementById("reset-email").value.trim();
                if (!resetEmail) {
                    alert("Please enter your admin email address.");
                    return;
                }
                alert("Password reset instructions have been sent to " + resetEmail);
                const modal = bootstrap.Modal.getInstance(document.getElementById("forgotPasswordModal"));
                if (modal) modal.hide();
            });
        });
    </script>
</body>
</html>
